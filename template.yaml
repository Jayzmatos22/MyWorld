AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MyWorld - API (Lambda + Function URL + DynamoDB) e front (S3 + CloudFront)

# Valores secretos: o deploy.ps1 lê do .env e passa aqui. NoEcho esconde no console e na API.
Parameters:
  RateLimitSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Chave do HMAC que anonimiza os IPs no rate limit (gere com "python -c 'import secrets; print(secrets.token_hex(32))'")
  NvidiaApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Chave do NVIDIA Build (vazio = provedor desligado)
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Chave do Groq (vazio = provedor desligado)
  GoogleApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Chave do Google AI Studio (vazio = provedor desligado)
  AlertEmail:
    Type: String
    Default: ""
    Description: E-mail para alertas de custo e de tráfego anormal (vazio = sem e-mail; o disjuntor funciona igual)
  MaxApiRequestsPer5Min:
    Type: Number
    Default: 15000
    Description: Acima disso em 5 min, o disjuntor desliga a API (concorrência reservada 0) até você religar

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ---------- API ----------
  MyWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/                 # só o back-end: o web/ (com node_modules) não entra no pacote
      Handler: main.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 30
      FunctionUrlConfig:
        AuthType: NONE
      LoggingConfig:
        LogGroup: !Ref MyWorldLogs  # sem isso os logs iam para um grupo sem retenção
      Environment:
        Variables:
          TABLE_NAME: !Ref MyWorldTable
          RATE_LIMIT_SECRET: !Ref RateLimitSecret
          NVIDIA_API_KEY: !Ref NvidiaApiKey
          GROQ_API_KEY: !Ref GroqApiKey
          GOOGLE_API_KEY: !Ref GoogleApiKey
          ENABLE_DOCS: "false"      # sem /docs, /redoc e /openapi.json em produção
          # O front chama a Function URL direto (não pelo CloudFront): assim o rate limit vê o IP real
          CORS_ORIGINS: !Sub '["https://${FrontDistribution.DomainName}"]'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MyWorldTable

  MyWorldLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/MyWorldFunction
      RetentionInDays: 7

  # Curtidas + contadores do rate limit. PROVISIONED dentro do free tier permanente
  # (25 RCU/25 WCU somando tabela e índices): passou disso, a tabela recusa em vez de cobrar.
  # Não ligar auto scaling, PITR nem Streams: saem do gratuito.
  MyWorldTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain          # apagar a stack não apaga as curtidas
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PROVISIONED
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: rank_pk
          AttributeType: S
        - AttributeName: likes
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      # 10 + 5 do índice = 15 de 25 grátis. Cada pedido com rate limit gasta 1 escrita por regra
      ProvisionedThroughput:
        ReadCapacityUnits: 10
        WriteCapacityUnits: 10
      GlobalSecondaryIndexes:
        # Só os APODs curtidos têm rank_pk: os contadores do rate limit ficam fora do índice
        - IndexName: by-likes
          KeySchema:
            - AttributeName: rank_pk
              KeyType: HASH
            - AttributeName: likes
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # ---------- Front ----------
  # Bucket privado: só o CloudFront lê (Origin Access Control)
  FrontBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-front
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} front
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_All  # inclui a borda de São Paulo; o free tier de 1 TB/mês vale para todas
        Origins:
          - Id: front
            DomainName: !GetAtt FrontBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: front
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref FrontHeadersPolicy
        # SPA: /placa/2024-01-01 não existe no bucket (o S3 responde 403); devolve o index.html
        # e o React Router resolve a rota
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # Headers de segurança do site. A CSP só deixa rodar script do próprio domínio, só conecta
  # na Function URL e só embute players do YouTube/Vimeo: um script injetado não executa nem vaza dados
  FrontHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-front-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self'; connect-src 'self' https://*.lambda-url.${AWS::Region}.on.aws; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
              Override: true

  FrontBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontDistribution}

  # ---------- Proteção de custo (DDoS) ----------
  # A Function URL é pública: rate limit por IP não segura um ataque de muitos IPs.
  # O disjuntor corta a API (concorrência 0 = Lambda não executa, nada é cobrado) quando o
  # volume foge do normal. Para religar: aws lambda delete-function-concurrency --function-name <FunctionName>
  AlertTopic:
    Type: AWS::SNS::Topic

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  KillSwitchTopic:
    Type: AWS::SNS::Topic

  KillSwitchLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/MyWorldKillSwitch
      RetentionInDays: 7

  KillSwitchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      LoggingConfig:
        LogGroup: !Ref KillSwitchLogs
      Environment:
        Variables:
          TARGET_FUNCTION: !Ref MyWorldFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:PutFunctionConcurrency
              Resource: !GetAtt MyWorldFunction.Arn
      Events:
        Alarm:
          Type: SNS
          Properties:
            Topic: !Ref KillSwitchTopic
      InlineCode: |
        import os
        import boto3

        def handler(event, context):
            target = os.environ["TARGET_FUNCTION"]
            boto3.client("lambda").put_function_concurrency(FunctionName=target, ReservedConcurrentExecutions=0)
            print(f"Disjuntor acionado: {target} com concorrência 0")

  ApiTrafficAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Volume anormal na API - o disjuntor desligou a Function URL
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref MyWorldFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref MaxApiRequestsPer5Min
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref KillSwitchTopic
        - !Ref AlertTopic

  # Teto de gasto: avisa por e-mail com 50% e 100% de US$ 2 (cerca de R$ 10) no mês
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-mensal
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 2
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  Url:
    Description: URL da API (Function URL)
    Value: !GetAtt MyWorldFunctionUrl.FunctionUrl
  FrontUrl:
    Description: Endereço do site
    Value: !Sub https://${FrontDistribution.DomainName}
  FrontBucketName:
    Value: !Ref FrontBucket
  FrontDistributionId:
    Value: !Ref FrontDistribution
  TableName:
    Value: !Ref MyWorldTable
  FunctionName:
    Description: Para religar a API depois do disjuntor - aws lambda delete-function-concurrency --function-name <este valor>
    Value: !Ref MyWorldFunction
